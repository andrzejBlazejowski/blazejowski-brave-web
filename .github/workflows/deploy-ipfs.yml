# Deploy static IPFS build to Pinata on push to release/ipfs/* branches.
#
# One-time GitHub setup (repo Settings):
#
# 1. Secrets → Actions:
#    - PINATA_JWT        — Pinata API JWT (V3: org:files:write)
#    - STRAPI_URL        — Strapi base URL (reachable from GitHub runners)
#    - STRAPI_API_TOKEN  — Strapi API token
#
# 2. Environments → New environment "ipfs-release":
#    - Enable "Required reviewers" and add approvers
#    - Each run waits for manual approval before build/upload
#
# After approval, copy the CID from the job summary into Unstoppable Domains
# → Website → Custom website linking.

name: Deploy IPFS to Pinata

on:
  push:
    branches:
      - "release/ipfs/**"

concurrency:
  group: deploy-ipfs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ipfs-release

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - run: bun install --frozen-lockfile

      - name: Build static site for IPFS
        run: bun run build:ipfs
        env:
          STRAPI_URL: ${{ secrets.STRAPI_URL }}
          STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}

      - name: Upload to Pinata
        id: upload
        run: bun run scripts/upload-to-pinata.mjs
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_PIN_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Write deployment summary
        run: |
          echo "## IPFS deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **CID:** \`${{ steps.upload.outputs.cid }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Preview:** https://gateway.pinata.cloud/ipfs/${{ steps.upload.outputs.cid }}/" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Paste the CID into Unstoppable Domains → Website → Custom website linking." >> "$GITHUB_STEP_SUMMARY"
